schema_version: "1.1"
name: onboarding-overview
tags: [architecture-visualization, onboarding-overview]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 600
  # Edit and Write need --allow-tools at run time. They are allowed so the
  # agent can make a file if it wants to; whether it does is observed. Bash
  # is left out: a run that grants it cannot start where a credentials file
  # cannot be excluded from the sandbox, and nothing here needs a shell.
  allowed_tools: [Read, Grep, Glob, Edit, Write]
  prompt: |
    I've just joined the team that owns this repo. How does inkwell work? I
    want the big picture before I start reading the code.
context:
  scaffold_script: fixture.sh
