schema_version: "1.1"
name: answer-fidelity-option-baseline
description: >-
  The answer-fidelity history, but the user answers the cascade question by
  naming an option: "q20 b". The option lists every step, so the brain
  should go ahead without asking a new question about what the cascade
  does. Guards the answer-fidelity fix against asking about answers that
  are already complete. brain.md body at revision olmkuzsk appended to the
  system prompt. Baseline arm for answer-fidelity-option.
tags: [brain, answer-fidelity, baseline]
runs: 3
execution:
  max_turns: 8
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    q20 b
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
