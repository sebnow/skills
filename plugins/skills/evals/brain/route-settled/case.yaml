schema_version: "1.1"
name: route-settled
description: >-
  ADR 3 records every decision for a CSV export, but no edit is spelled
  out: a new module, CLI wiring, tests, and the README. The decisions
  are made, so the brain should hand it to the cheapest worker that
  builds from recorded decisions, without reading the code or writing
  the spec edit by edit itself, and without the senior. The workspace is
  tally, a small Python CLI with tests and ADRs, committed in git. Run
  with --allow-tools Bash Edit Write, so the brain could do the work
  itself; tools/root-work.py counts the root's own tool calls from a
  --keep-temp trace; the graders here check only which worker ran, since
  a tool_used grader also counts the workers' calls. brain.md body
  appended to the system prompt.
tags: [brain, routing]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Bash, Edit, Write]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    ADR 3, the CSV export, was accepted this morning. Get it built, with
    tests.
context:
  scaffold_script: fixture.sh
