schema_version: "1.1"
name: route-tiny
description: >-
  A one-word typo in a file the user names. Briefing a worker costs more
  than the edit, so the brain should fix it itself and dispatch nobody.
  Guards against the routing rules pushing every edit to a worker. The
  workspace is tally, a small Python CLI with tests and ADRs, committed
  in git. Run with --allow-tools Bash Edit Write, so the brain could do
  the work itself; tools/root-work.py counts the root's own tool calls
  from a --keep-temp trace; the graders here check only which worker
  ran, since a tool_used grader also counts the workers' calls. brain.md
  body appended to the system prompt.
tags: [brain, routing]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Bash, Edit, Write]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    There's a typo in the help text of the invoice subcommand in
    tally/cli.py: "invocie". Fix it.
context:
  scaffold_script: fixture.sh
