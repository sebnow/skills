schema_version: "1.1"
name: breaking-rename
description: >-
  A git repository with a Conventional Commits history whose README
  documents wordstat.count.count(text) as the Python API. The working copy
  renames it to count_text, updating the callers, tests and README: one
  change that breaks every outside caller. The commit should mark it with
  ! before the subject's colon and a BREAKING CHANGE: footer naming
  count_text.
tags: [commit, breaking]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  prompt: |
    Commit my changes.
context:
  scaffold_script: fixture.sh
