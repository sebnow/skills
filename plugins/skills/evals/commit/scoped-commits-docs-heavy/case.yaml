schema_version: "1.1"
name: scoped-commits-docs-heavy
description: >-
  scoped-commits-docs-trap with the history reordered and extended so the
  newest six commits are all docs:, and the code scopes (count:, cli:,
  treewide:) sit below what git log -5 shows. The uncommitted change is the
  same code-only word-count fix, so its subject should open with a module
  scope such as count:, not a Conventional Commits type.
tags: [commit, convention]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  prompt: |
    Commit my changes.
context:
  scaffold_script: fixture.sh
