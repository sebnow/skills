schema_version: "1.1"
name: fan-out
tags: [delegate, scout]
runs: 1
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Before we redesign account naming I need to know every place in this repo
    that builds or parses an account name string, with file and line. Have a
    subagent sweep it. I only want the summary.
context:
  scaffold_script: fixture.sh
