schema_version: "1.1"
name: web-research
tags: [delegate, scout]
runs: 1
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Before I pick a minimum Go version I need to know which Go release
    dropped support for macOS 10.15, with a link to where it says so. Have a
    subagent look it up online. I only want the answer and the link.
