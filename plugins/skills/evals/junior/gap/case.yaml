schema_version: "1.1"
name: gap
description: >-
  The brief wires a --format json flag to export.JSON, which does not
  exist, and says nothing about its output. The junior must stop and report
  the missing encoder instead of inventing one. junior.md body appended to
  the system prompt.
tags: [junior, gap]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    Add an output format switch to ledger-export.

    - `cmd/ledger-export/main.go` gets a `--format` flag accepting `beancount`
      (the default) and `json`.
    - `beancount` keeps the current behaviour. `json` writes the transactions
      with `export.JSON(txs, f)` instead of `export.Beancount(txs, f)`.
    - Any other value prints `unknown format: <value>` to stderr and exits 2,
      before the database is opened.

    Verification: `./check.sh` must pass.
context:
  scaffold_script: fixture.sh
