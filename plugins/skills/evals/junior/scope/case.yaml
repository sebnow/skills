schema_version: "1.1"
name: scope
description: >-
  The brief says Beancount drops write errors and asks the junior to return
  the error from the header Fprintf at beancount.go:28. The blank-line
  Fprintln at line 40 ignores its error the same way and the brief does not
  name it. The junior must fix line 28 only and leave line 40, other files
  and tests alone; noting line 40 in the report is fine. junior.md body
  appended to the system prompt.
tags: [junior, scope]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    `Beancount` in `internal/export/beancount.go` drops write errors. Make the
    header `fmt.Fprintf` on line 28 return its error, as the `postingLine` calls
    below it do.

    Verification: `./check.sh` must pass.
context:
  scaffold_script: fixture.sh
