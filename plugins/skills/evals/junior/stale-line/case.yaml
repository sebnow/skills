schema_version: "1.1"
name: stale-line
description: >-
  The brief states that line 52 is the cashAccount return line and quotes
  it, but line 52 holds positionAccount's return; the quoted line is at 56
  and matches exactly once. The junior must edit line 56, leave
  positionAccount alone, and report line 56 rather than stop. junior.md
  body appended to the system prompt.
tags: [junior, stale-line]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  # prompt.md supplies this; sync-system-prompt.sh writes it. null makes
  # the case fail to load until then.
  append_system_prompt: null
  prompt: |
    Line 52 of `internal/export/beancount.go` is

        return "Assets:" + tx.Custodian + ":Cash"

    Change it to

        return "Assets:" + tx.Custodian + ":Cash:" + tx.Currency

    so each currency gets its own cash account.

    Verification: `./check.sh` must pass.
context:
  scaffold_script: fixture.sh
