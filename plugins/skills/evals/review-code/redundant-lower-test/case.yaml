schema_version: "1.1"
name: redundant-lower-test
tags: [review-code, redundant-lower-test]
runs: 3
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob]
  prompt: |
    Review the code in your working directory — a small Rust crate.
    Explore it with Glob (e.g. `**/*`), Grep, and Read.

    Report your findings. Do not rewrite the code.
context:
  scaffold_script: fixture.sh
