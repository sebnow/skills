schema_version: "1.1"
name: code-review-request
tags: [review-design, negative-trigger]
runs: 3
execution:
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Grep, Glob, Skill]
  prompt: |
    Review the last three commits before I push them. Are they ready to go?

    The repository is in your working directory, a Go module. I exported the
    three commits to `last-three-commits.patch`; explore the rest of the code
    with Glob (e.g. `**/*`), Grep, and Read.
context:
  scaffold_script: fixture.sh
