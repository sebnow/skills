schema_version: "1.1"
name: similar-jobs
tags: [review-design, similar-jobs, control]
runs: 3
execution:
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Grep, Glob, Skill]
  prompt: |
    Do a design review of pantry's cron jobs (`src/pantry/cron.py` and the code
    it runs) and report the architectural transformations that would improve
    them. Don't change any code.

    The repository is in your working directory, a Python package. Explore it
    with Glob (e.g. `**/*`), Grep, and Read.
context:
  scaffold_script: fixture.sh
